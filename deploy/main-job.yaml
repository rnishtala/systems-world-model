apiVersion: batch/v1
kind: Job
metadata:
  name: dreamer-main-v1
  namespace: systems-world-model-lab
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app: dreamer-poc
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: amd-halo
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: experiment
          image: python:3.11-slim
          resources:
            requests: {cpu: '2', memory: 4Gi}
            limits: {cpu: '4', memory: 6Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - {name: PYTHONUNBUFFERED, value: '1'}
            - {name: HOME, value: /results}
            - {name: OMP_NUM_THREADS, value: '4'}
            - {name: OPENBLAS_NUM_THREADS, value: '1'}
            - {name: XLA_FLAGS, value: '--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=4'}
          command: [/bin/sh, -ec]
          args:
            - |
              cd /results/work
              export PYTHONPATH=/results/work:/results/work/upstream
              export DREAMER_SOURCE=/results/work/upstream
              export EVAL_SEED_OFFSET=1000000
              mkdir -p /results/main
              for seed in 0 1 2; do
                /results/venv/bin/python -m experiment.run --seed "$seed" --steps 50000 --out /results/main > "/results/main/train-$seed.log" 2>&1
              done
              echo ALL_EXPERIMENTS_COMPLETE
          volumeMounts:
            - {name: source, mountPath: /source, readOnly: true}
            - {name: results, mountPath: /results}
            - {name: temp, mountPath: /tmp}
      volumes:
        - name: source
          configMap:
            name: experiment-source
        - name: results
          persistentVolumeClaim:
            claimName: results
        - name: temp
          emptyDir:
            sizeLimit: 1Gi
