apiVersion: batch/v1
kind: Job
metadata:
  name: dreamer-confirm-10-v4
  namespace: systems-world-model-lab
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app: dreamer-poc
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: amd-halo
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: experiment
          image: python:3.11-slim
          resources:
            requests: {cpu: '1', memory: 1536Mi}
            limits: {cpu: 1333m, memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - {name: PYTHONUNBUFFERED, value: '1'}
            - {name: HOME, value: /results}
            - {name: OMP_NUM_THREADS, value: '1'}
            - {name: PYTHONDONTWRITEBYTECODE, value: '1'}
            - {name: OPENBLAS_NUM_THREADS, value: '1'}
            - {name: XLA_FLAGS, value: '--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1'}
          command: [/bin/sh, -ec]
          args:
            - |
              mkdir -p /results/confirm-work-10
              tar xzf /source/source.tar.gz -C /results/confirm-work-10
              cd /results/confirm-work-10
              export PYTHONPATH=/results/confirm-work-10:/results/confirm-work-10/upstream
              export DREAMER_SOURCE=/results/confirm-work-10/upstream
              export EVAL_SEED_OFFSET=4000000
              mkdir -p /results/confirmation-v4
              /results/venv/bin/python -m experiment.run --seed 10 --steps 100000 --inspection-coverage 0.5 --abstention-penalty 2.0 --out /results/confirmation-v4 > /results/confirmation-v4/train-10.log 2>&1 || { tail -60 /results/confirmation-v4/train-10.log; exit 1; }
              /results/venv/bin/python -m experiment.evaluate_planner --config /results/confirmation-v4/train-10/config.yaml --checkpoint /results/confirmation-v4/final-10 --out /results/confirmation-v4/particle-results-10.json --controller particles --eval-offset 4000000
          volumeMounts:
            - {name: source, mountPath: /source, readOnly: true}
            - {name: results, mountPath: /results}
            - {name: temp, mountPath: /tmp}
      volumes:
        - name: source
          configMap:
            name: experiment-source-v7
        - name: results
          persistentVolumeClaim:
            claimName: results
        - name: temp
          emptyDir:
            sizeLimit: 1Gi

