apiVersion: batch/v1
kind: Job
metadata:
  name: dreamer-penalty-v2
  namespace: systems-world-model-lab
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app: dreamer-poc
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: amd-halo
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: experiment
          image: python:3.11-slim
          resources:
            requests: {cpu: '2', memory: 4Gi}
            limits: {cpu: '4', memory: 6Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - {name: PYTHONUNBUFFERED, value: '1'}
            - {name: HOME, value: /results}
            - {name: OMP_NUM_THREADS, value: '4'}
            - {name: OPENBLAS_NUM_THREADS, value: '1'}
            - {name: XLA_FLAGS, value: '--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=4'}
          command: [/bin/sh, -ec]
          args:
            - |
              mkdir -p /results/work-v2
              tar xzf /source/source.tar.gz -C /results/work-v2
              cd /results/work-v2
              export PYTHONPATH=/results/work-v2:/results/work/upstream
              export DREAMER_SOURCE=/results/work/upstream
              export EVAL_SEED_OFFSET=2000000
              mkdir -p /results/penalty-v2
              /results/venv/bin/python -m pytest tests -q
              for seed in 0; do
                /results/venv/bin/python -m experiment.run --seed "$seed" --steps 50000 --abstention-penalty 2.0 --out /results/penalty-v2 > "/results/penalty-v2/train-$seed.log" 2>&1
              done
              echo ALL_EXPERIMENTS_COMPLETE
          volumeMounts:
            - {name: source, mountPath: /source, readOnly: true}
            - {name: results, mountPath: /results}
            - {name: temp, mountPath: /tmp}
      volumes:
        - name: source
          configMap:
            name: experiment-source-v2
        - name: results
          persistentVolumeClaim:
            claimName: results
        - name: temp
          emptyDir:
            sizeLimit: 1Gi
