apiVersion: batch/v1
kind: Job
metadata:
  name: dreamer-greedy-v6
  namespace: systems-world-model-lab
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: dreamer-poc
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: amd-halo
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: experiment
          image: python:3.11-slim
          resources:
            requests: {cpu: '2', memory: 4Gi}
            limits: {cpu: '4', memory: 6Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - {name: PYTHONUNBUFFERED, value: '1'}
            - {name: HOME, value: /results}
            - {name: OMP_NUM_THREADS, value: '4'}
            - {name: OPENBLAS_NUM_THREADS, value: '1'}
            - {name: XLA_FLAGS, value: '--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=4'}
          command: [/bin/sh, -ec]
          args:
            - |
              mkdir -p /results/work-greedy-v6
              tar xzf /source/source.tar.gz -C /results/work-greedy-v6
              cd /results/work-greedy-v6
              export PYTHONPATH=/results/work-greedy-v6:/results/work/upstream
              export DREAMER_SOURCE=/results/work/upstream
              /results/venv/bin/python -m pytest tests -q
              /results/venv/bin/python -m experiment.evaluate_planner --config /results/combined-v4/train-0/config.yaml --checkpoint /results/combined-v4/final-0 --out /results/combined-v4/greedy-results.json --controller greedy --eval-offset 8000000
          volumeMounts:
            - {name: source, mountPath: /source, readOnly: true}
            - {name: results, mountPath: /results}
            - {name: temp, mountPath: /tmp}
      volumes:
        - name: source
          configMap:
            name: experiment-source-v6
        - name: results
          persistentVolumeClaim:
            claimName: results
        - name: temp
          emptyDir:
            sizeLimit: 1Gi
